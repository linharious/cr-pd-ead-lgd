<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Credit Risk Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Credit Risk Studio</div>
      <nav>
        <a href="/" class="nav-link{% if active == 'dashboard' %} active{% endif %}">Dashboard</a>
        <a href="/score" class="nav-link{% if active == 'score' %} active{% endif %}">Score an applicant</a>
        <a href="/batch" class="nav-link{% if active == 'batch' %} active{% endif %}">Batch scoring</a>
        <a href="/portfolio" class="nav-link{% if active == 'portfolio' %} active{% endif %}">Portfolio &amp; EL</a>
        <a href="/performance" class="nav-link{% if active == 'performance' %} active{% endif %}">Model performance</a>
        <a href="/monitoring" class="nav-link{% if active == 'monitoring' %} active{% endif %}">Monitoring</a>
        <a href="/downloads" class="nav-link{% if active == 'downloads' %} active{% endif %}">Downloads</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
