<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Credit Risk Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Credit Risk Studio</div>
      <nav>
        <a href="/" class="nav-link{% if active == 'dashboard' %} active{% endif %}">Dashboard</a>
        <a href="/score" class="nav-link{% if active == 'score' %} active{% endif %}">Score an applicant</a>
        <span class="nav-link disabled">Batch scoring <span class="soon">soon</span></span>
        <span class="nav-link disabled">Downloads <span class="soon">soon</span></span>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
