{% extends "base.html" %}
{% block title %}Score · Credit Risk Studio{% endblock %}
{% block content %}
  <h1>Score an applicant</h1>
  <p class="sub">Enter the applicant's details to estimate credit score and probability of default.</p>

  <div class="panel">
    <form hx-post="/calculate" hx-target="#result" hx-swap="innerHTML" hx-indicator="#spin">
      <div class="grid">
        <div>
          <label>Loan amount</label>
          <input type="number" name="funded_amnt" value="10000" step="100" min="0">
        </div>
        <div>
          <label>Annual income</label>
          <input type="number" name="annual_inc" value="60000" step="1000" min="0">
        </div>
        <div>
          <label>Interest rate (%)</label>
          <input type="number" name="int_rate" value="13.5" step="0.01" min="0">
        </div>
        <div>
          <label>DTI</label>
          <input type="number" name="dti" value="15" step="0.1" min="0">
        </div>
        <div>
          <label>Term</label>
          <select name="term">
            <option>36 months</option>
            <option>60 months</option>
          </select>
        </div>
        <div>
          <label>Grade</label>
          <select name="grade">
            {% for g in ["A","B","C","D","E","F","G"] %}<option{% if g == "B" %} selected{% endif %}>{{ g }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label>Home ownership</label>
          <select name="home_ownership">
            <option>MORTGAGE</option><option>RENT</option><option>OWN</option><option>OTHER</option>
          </select>
        </div>
        <div>
          <label>Purpose</label>
          <select name="purpose">
            <option>debt_consolidation</option><option>credit_card</option>
            <option>home_improvement</option><option>major_purchase</option>
            <option>small_business</option><option>car</option><option>medical</option>
            <option>moving</option><option>vacation</option><option>house</option>
            <option>wedding</option><option>renewable_energy</option>
            <option>educational</option><option>other</option>
          </select>
        </div>
        <div>
          <label>Employment length</label>
          <select name="emp_length">
            <option>10+ years</option><option>&lt; 1 year</option>
            {% for n in [1,2,3,4,5,6,7,8,9] %}<option>{{ n }} year{% if n > 1 %}s{% endif %}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label>Verification status</label>
          <select name="verification_status">
            <option>Verified</option><option>Source Verified</option><option>Not Verified</option>
          </select>
        </div>
        <div>
          <label>State</label>
          <input type="text" name="addr_state" value="CA" maxlength="2" style="text-transform:uppercase">
        </div>
        <div>
          <label>Inquiries (last 6 months)</label>
          <input type="number" name="inq_last_6mths" value="0" step="1" min="0">
        </div>
      </div>
      <button type="submit">Calculate <span id="spin" class="htmx-indicator">…</span></button>
    </form>

    <div id="result" class="result"></div>
  </div>
{% endblock %}
