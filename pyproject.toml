[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk"
version = "0.1.0"
description = "Credit risk modelling: PD, LGD, EAD, Expected Loss, and PSI monitoring."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
web = ["fastapi", "uvicorn[standard]", "jinja2", "python-multipart", "mangum"]

[tool.setuptools.packages.find]
include = ["creditrisk*", "training*", "app*"]
